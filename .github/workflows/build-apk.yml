name: Build Android APK com Unity Ads

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Projeto e Plugin Unity Ads
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mkdir www
          
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Meu Jogo com Unity Ads</title>
              <style>
                  body { background: #111; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
                  button { padding: 15px 30px; font-size: 18px; background: #00FFCC; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 20px; }
              </style>
          </head>
          <body>
              <h1>Meu Jogo Mobile</h1>
              <p>Status: <span id="status">Inicializando Ads...</span></p>
              <button onclick="mostrarAnuncio()">Assistir Anúncio</button>

              <script>
                  const GAME_ID = "6177207";
                  const PLACEMENT_ID = "Rewarded_Android";

                  function initAds() {
                      document.getElementById("status").innerText = "Unity Ads Pronto!";
                  }
                  setTimeout(initAds, 1000);

                  function mostrarAnuncio() {
                      alert("Disparando Unity Ads (Game ID: " + GAME_ID + ")");
                  }
              </script>
          </body>
          </html>
          EOF

          npx cap init MeuJogo com.exemplo.meujogo --web-dir www
          npx cap add android

      - name: Configurar JDK (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compilar APK de Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
