name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Criar Estrutura do Projeto Web
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Cria a pasta 'www' obrigatória para os arquivos web
          mkdir www
          
          # Cria um index.html básico para o jogo
          echo '<!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Meu Jogo Unity Ads</title>
              <style>
                  body { background: #111; color: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
                  button { padding: 15px 30px; font-size: 18px; background: #00FFCC; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; }
              </style>
          </head>
          <body>
              <h1>Meu Jogo Mobile</h1>
              <p>Teste de Integração Unity Ads</p>
              <button onclick="alert(\'Anúncio da Unity seria disparado aqui!\')">Assistir Anúncio</button>
          </body>
          </html>' > www/index.html

          # Inicializa o Capacitor apontando para a pasta 'www'
          npx cap init MeuJogo com.exemplo.meujogo --web-dir www
          npx cap add android

      - name: Configurar JDK (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar APK de Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: meu-jogo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
