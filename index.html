<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo com Unity Ads</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; padding-top: 30px; margin: 0; }
        button { padding: 15px 30px; font-size: 18px; background: #00FFCC; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 20px; }
        
        #unity-banner-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #444;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Meu Jogo Mobile</h1>
    <p>Status: <span id="status">Aguardando Unity Ads...</span></p>
    <button onclick="mostrarRecompensa()">Assistir Vídeo (Rewarded_Android)</button>

    <div id="unity-banner-container">
        [ Banner Unity: Banner_Android ]
    </div>

    <script>
        const GAME_ID = "6177207";
        const BANNER_ID = "Banner_Android";
        const REWARDED_ID = "Rewarded_Android";

        function initAds() {
            document.getElementById("status").innerText = "Unity Ads Inicializado!";
        }

        setTimeout(initAds, 1500);

        function mostrarRecompensa() {
            alert("Disparando Anúncio Premiado (" + REWARDED_ID + ") - Game ID: " + GAME_ID);
        }
    </script>
</body>
</html>
